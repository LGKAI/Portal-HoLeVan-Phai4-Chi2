# ========================================
# Portal Họ Lê Văn - Phái 4 - Chi 2
# Docker Compose - Khởi chạy toàn bộ hệ thống
# ========================================

networks:
  portal-network:
    driver: bridge

volumes:
  postgres-data:
    name: portal_postgres_data
  uploads-data:
    name: portal_uploads
  chroma-data:
    name: portal_chroma

services:

  # ==========================================
  # 1. PostgreSQL 15 (Supabase Compatible)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: portal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-portal_hlevan}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - portal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-portal_hlevan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Backend Node.js / Express
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-portal_hlevan}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RAG_SERVICE_URL: http://rag-service:8000
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================
  # 3. Frontend React (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: portal_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - portal-network

  # ==========================================
  # 4. RAG Service (Python FastAPI)
  # Kết nối Ollama chạy trên máy host (không trong Docker)
  # ==========================================
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: portal_rag
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Windows Docker: host.docker.internal trỏ tới máy host (nơi Ollama chạy)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      BACKEND_URL: http://backend:5000
      CHROMA_PERSIST_DIR: /app/data/vector_store
      RAW_DOCS_DIR: /app/data/raw_documents
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/app/data/vector_store
      - ./rag-service/data/raw_documents:/app/data/raw_documents
    depends_on:
      - backend
    networks:
      - portal-network
    extra_hosts:
      # Đảm bảo container có thể reach máy host (Ollama)
      - "host.docker.internal:host-gateway"
