# Nginx config cho React SPA + reverse proxy tới Backend
server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy API requests tới backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        # SSE support (cho streaming chatbot)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Proxy uploads
    location ^~ /uploads/ {
        proxy_pass http://backend:5000/uploads/;
    }

    # React Router: fallback về index.html cho tất cả routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Không cache index.html để client luôn nhận bản mới nhất
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets có thể cache ngắn hoặc có query params
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }
}
